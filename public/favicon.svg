@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg: #f4efe6;
  --panel: #fffdf9;
  --panel-alt: #f8f1e4;
  --ink: #1e2331;
  --muted: #58657c;
  --primary: #1a4d9e;
  --primary-strong: #123f87;
  --accent: #f4b942;
  --line: rgba(16, 24, 40, 0.12);
  --shadow: 0 24px 56px rgba(30, 35, 49, 0.12);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.container {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(244, 239, 230, 0.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  font-size: 1.3rem;
}

.brand img {
  width: 38px;
  height: 38px;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 20px;
  color: var(--muted);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.8rem 1.25rem;
  font-weight: 700;
  transition: 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
  box-shadow: var(--shadow);
}

.btn-primary:hover {
  background: var(--primary-strong);
}

.btn-ghost {
  background: rgba(255,255,255,0.4);
}

.hero {
  padding: 64px 0 40px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 32px;
  align-items: center;
}

.eyebrow {
  margin: 0 0 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--primary);
}

h1, h2, h3 {
  margin: 0 0 0.75rem;
  line-height: 1.05;
}

h1 {
  font-size: clamp(3rem, 5vw, 5rem);
  letter-spacing: -0.06em;
}

h1 em {
  color: var(--primary);
  font-style: normal;
}

.lead {
  max-width: 640px;
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  color: var(--muted);
}

.cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 24px;
}

.microcopy {
  margin-top: 18px;
  color: var(--muted);
}

.hero-card {
  background: linear-gradient(180deg, #fffefa 0%, #f5f3e5 100%);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 26px;
  box-shadow: var(--shadow);
}

.card-badge {
  display: inline-block;
  background: rgba(26, 77, 158, 0.08);
  color: var(--primary);
  border-radius: 999px;
  padding: 0.45rem 0.8rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.hero-card h2 {
  font-size: clamp(2rem, 3vw, 2.7rem);
  margin-top: 1rem;
}

.hero-card p,
.hero-card li {
  color: var(--muted);
}

.hero-card ul {
  padding-left: 1.2rem;
  margin: 1rem 0 0;
}

.info-section {
  padding: 48px 0;
}

.info-section.alt {
  background: rgba(255,255,255,0.28);
}

.info-section h2 {
  font-size: clamp(2rem, 3vw, 3rem);
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 28px;
}

.steps {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 18px;
}

.steps li {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,0.35);
}

.steps span {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--ink);
  font-weight: 800;
}

.pricing-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  margin-top: 24px;
}

.price-card {
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 30px 22px;
}

.price-card.featured {
  background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
  color: white;
  border-color: transparent;
}

.label {
  display: inline-block;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.72rem;
  opacity: 0.75;
}

.price {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  margin: 14px 0;
}

.price small {
  font-size: 1rem;
  opacity: 0.8;
}

.faq-section {
  padding-bottom: 72px;
}

.faq-list {
  display: grid;
  gap: 14px;
  margin-top: 22px;
}

.faq-list details {
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 1rem 1.2rem;
}

.faq-list summary {
  cursor: pointer;
  font-weight: 700;
}

.faq-list p {
  margin: 0.75rem 0 0;
  color: var(--muted);
}

.site-footer {
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,0.2);
  padding: 24px 0 40px;
}

.footer-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.footer-brand {
  font-size: 1.1rem;
}

@media (max-width: 820px) {
  .main-nav {
    display: none;
  }

  .hero-grid,
  .two-col,
  .pricing-grid {
    grid-template-columns: 1fr;
  }

  .nav-wrap {
    min-height: 68px;
  }

  .header-actions {
    gap: 8px;
  }
}
